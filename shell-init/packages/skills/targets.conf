# AI Agent Skills 链接目标（流行工具）
#
# 格式: id|skills路径(相对$HOME)|说明|探测路径
#   探测路径: 逗号分隔；相对 $HOME，或以 / 开头的绝对路径，或 cmd:二进制名
#   省略第 4 列时，默认探测 skills 路径的父目录
#   * = 始终链接（仅建议用于跨工具共享目录）
#
# 默认同步：自动识别已安装工具（任一探测路径存在即链接）
# 覆盖: --skills-targets=cursor,claude  或  --skills-targets=all
#
# 技能本体: 本目录/<name>/SKILL.md
# 运行: ./setup.sh --steps=skills

# --- 主流 / 跨工具 ---
agents|.agents/skills|Agents 共享标准（Codex/Cline/Copilot/Cursor 等）|.agents,.codex,.cline,.copilot,.cursor
cursor|.cursor/skills|Cursor|.cursor,/Applications/Cursor.app
claude|.claude/skills|Claude Code|.claude,cmd:claude
codex|.codex/skills|Codex（legacy 路径）|.codex,cmd:codex
gemini|.gemini/skills|Gemini CLI|.gemini,cmd:gemini
copilot|.copilot/skills|GitHub Copilot|.copilot
opencode|.config/opencode/skills|OpenCode|.config/opencode,cmd:opencode

